{% extends 'index.html' %}

{% block content %}
    <h1>Edition de categorie</h1>
    <form method="post">
        {% csrf_token %}
        <label>Libelle</label><br>
        <input type="text" name="libelle" value="{{ categorie.libelle }}"><br><br>
        <input type="hidden" name="id" value="{{ categorie.id }}">
        <button type="submit">Enregistrer</button>
    </form>
{% endblock %}
